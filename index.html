<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="李佳蓓的个人网站：教育科技、编程教研、课程研发与内容运营。" />
  <title>李佳蓓 | Portfolio</title>
  <link rel="icon" href="./assets/images/brand-avatar.png" type="image/png" />
  <link rel="stylesheet" href="./css/style.css?v=20261028-photo-panel" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>
  <script src="./js/content.js?v=20261028-functional-audit" defer></script>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="返回首页">
        <span class="brand-mark">
          <img class="brand-avatar" src="./assets/images/brand-avatar.png" alt="李佳蓓头像" />
        </span>
        <span class="brand-name">PORTFOLIO</span>
      </a>
      <nav class="nav" id="mainNav" aria-label="主导航"></nav>
      <div class="topbar-actions">
        <button
          class="mode-switch"
          id="modeSwitch"
          type="button"
          aria-haspopup="dialog"
          aria-controls="authModal"
        >
          <span id="modeSwitchLabel">朋友版</span>
          <span class="mode-switch__arrow" aria-hidden="true">↗</span>
        </button>
        <a class="download-link" id="resumeLink" href="./assets/docs/Double-rusume.pdf" download="Double-rusume.pdf">简历</a>
        <a class="download-link" id="portfolioLink" href="./assets/docs/1.pdf" target="_blank" rel="noopener noreferrer">作品集</a>
      </div>
    </header>

    <main id="top">
      <div id="guestContent" data-site-version="guest">
        <a class="scroll-cue" id="scrollCue" href="#education">继续下滑，探索更多</a>
        <section class="hero hero--photo-background" id="about-me" aria-labelledby="hero-title">
        <div class="hero-copy">
          <div class="eyebrow" id="heroEyebrow">在线</div>
          <h1 id="heroTitle">Hi，<br />加倍 Double</h1>
          <div class="hero-title" id="heroSubtitle">虽然我不喜欢给人贴标签但是为了快速了解我</div>
        </div>
        <div class="typographic-wall" id="heroTags" aria-label="个人标签动态文字墙"></div>
        </section>

        <section class="section" id="education" aria-label="教育背景">
        <div class="education-list" id="educationList"></div>
        </section>

        <section class="section" id="about">
        <div class="section-header">
          <div>
            <p class="section-kicker">AI coding</p>
            <h2>“先试着玩一下嘛”</h2>
          </div>
          <p id="aboutSummary"></p>
        </div>
        <div class="project-list" id="projectList"></div>
        </section>

        <section class="section" id="work">
        <div class="section-header">
          <div>
            <p class="section-kicker">Experience</p>
            <h2>牛马驾到 统统闪开</h2>
          </div>
          <p id="workSummary"></p>
        </div>
        <div class="surface">
          <div class="timeline work-timeline" id="workList"></div>
        </div>
        </section>

        <section class="section section--skills" id="other">
        <div class="section-header section-header--skills">
          <div>
            <h2>点击或拖动翻牌</h2>
          </div>
          <p id="skillsSummary"></p>
        </div>
        <div class="skill-list" id="skillList"></div>
        </section>

        <section class="section section--contact" id="contact">
        <div class="contact-panel">
          <div class="contact-panel__copy">
            <p class="section-kicker section-kicker--contact">LET'S TALK</p>
            <h2>
              <span>下一段经历</span>
              <span>也许可以一起创建。</span>
            </h2>
            <p id="contactSummary"></p>
          </div>
          <div class="contact-actions" id="contactList"></div>
        </div>
        </section>
      </div>

      <section class="friend-content" id="friendContent" data-site-version="friend" hidden>
        <div id="friendSpaceRoot"></div>
      </section>
    </main>

    <footer class="footer" id="footer"></footer>
  </div>

  <div class="auth-modal" id="authModal" hidden>
    <div class="auth-modal__backdrop" data-auth-close></div>
    <section
      class="auth-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="authTitle"
    >
      <button class="auth-dialog__close" id="authClose" type="button" aria-label="关闭">
        ×
      </button>
      <p class="section-kicker">FRIENDS ONLY</p>
      <h2 id="authTitle">登录朋友版</h2>
      <p class="auth-dialog__intro" id="authIntro">
        输入邮箱和密码，登录后进入朋友版。
      </p>

      <form class="auth-form" id="authForm">
        <label class="auth-field">
          <span>邮箱</span>
          <input
            id="authEmail"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="输入你的邮箱"
            required
          />
        </label>
        <label class="auth-field">
          <span>密码</span>
          <input
            id="authPassword"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="72"
            placeholder="至少 8 位"
            required
          />
        </label>
        <label class="auth-remember">
          <input id="authRemember" name="remember" type="checkbox" checked />
          <span>保持登录状态</span>
        </label>
        <button class="auth-submit" id="authSubmit" type="submit">登录并进入</button>
        <p class="auth-status" id="authStatus" role="status" aria-live="polite"></p>
        <p class="auth-mode-hint" id="authModeHint">
          <span id="authModePrompt">还没有账号？</span>
          <button class="auth-mode-link" id="authModeToggle" type="button">先来注册吧</button>
        </p>
        <button class="auth-resend" id="authResend" type="button" hidden>
          重新发送验证邮件
        </button>
      </form>
      <p class="auth-security-note">
        注册和登录由 Supabase Auth 处理。密码不会写入这个网站的代码或浏览器本地存储。
      </p>
    </section>
  </div>
</body>
</html>
